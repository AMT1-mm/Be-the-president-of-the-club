.pt{background:linear-gradient(160deg,#ffffff16,#ffffff05);border:1px solid #ffffff24;border-radius:14px;padding:10px 6px;text-align:center;animation:fl 4s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes fl{50%{transform:translateY(-5px)}}

const cloudSave=async f=>{const d=cdoc();if(!d||!G||!G.sq)return;try{G._t=Date.now();const j=JSON.stringify(G);if(j.length>240000)return;const k=j.length+':'+G.w+':'+G.coins+':'+G.cash;if(f!==true&&k===CLH)return;await d.set({j,t:G._t});CLH=k;CLS=1;if(f===true)toast('☁️ تم الحفظ السحابي')}catch(e){CLS=-1;if(f===true)toast('تعذر الحفظ السحابي')}};
const cloudLoad=async()=>{const d=cdoc();if(!d)return false;try{const s=await d.get();if(s.exists){const c=s.data();if(c&&c.j&&c.t>(G._t||0)){ask('☁️ وجدت نسخة محفوظة سحابياً أحدث للمدرب «'+esc(MGR)+'». تحميلها؟',()=>{G=JSON.parse(c.j);try{localStorage.setItem(sk(),c.j)}catch(e){}render()});return true}}}catch(e){}return false};
const cloudBadge=()=>`<div style="margin-top:6px;font-size:13px">☁️ الحفظ السحابي: ${DBC&&UID_?(CLS<0?'⚠️ تعذر الحفظ':'مفعّل'):'غير متاح (سجّل دخولك في Claude)'} <button class="o" onclick="cloudSave(true)">حفظ الآن</button> <button class="o" onclick="tutShow(0)">❓ دليل اللعبة</button></div>`;
setInterval(()=>cloudSave(),30000);document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudSave()});
setInterval(()=>{if(G&&G.sq&&!SPL&&TUTD!==G){TUTD=G;cloudLoad().then(p=>{if(!p)setTimeout(()=>{if(!G.tut)tutShow(0);else dailyChk()},800)})}},1500);

ld();render();
</script></body></html>
